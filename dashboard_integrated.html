<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitive Intelligence Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 { color: #1a202c; margin-bottom: 10px; }
        .subtitle { color: #718096; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #4a5568; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .progress-container { display: none; margin: 20px 0; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text { margin-top: 10px; color: #4a5568; text-align: center; }
        .results-container { display: none; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-value { font-size: 32px; font-weight: 700; color: #1a202c; }
        .stat-label { color: #718096; font-size: 14px; }
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .download-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .download-btn:hover { background: #667eea; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginScreen" class="card">
            <h1>🚀 Competitive Intelligence Platform</h1>
            <p class="subtitle">Sign in to start analyzing competitors</p>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" value="admin@test.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" value="password">
            </div>
            <button class="btn" onclick="login()">Sign In</button>
        </div>
        
        <div id="dashboardScreen" class="hidden">
            <div class="card">
                <h1>🎯 Competitive Intelligence Dashboard</h1>
                <p class="subtitle">Find competitors and potential clients</p>
                <div class="input-group">
                    <label>🔍 Search Query</label>
                    <input type="text" id="searchQuery" value="law firms jacksonville fl">
                </div>
                <div class="input-group">
                    <label>📊 Max Results</label>
                    <select id="maxResults">
                        <option value="5">5 competitors</option>
                        <option value="10" selected>10 competitors</option>
                    </select>
                </div>
                <button class="btn" id="runBtn" onclick="runIntelligence()">🚀 Run Complete Analysis</button>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                    <div class="progress-text" id="progressText">Starting...</div>
                </div>
            </div>
            
            <div id="resultsContainer" class="results-container">
                <div class="card">
                    <h2>✨ Analysis Complete!</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="statCompetitors">0</div>
                            <div class="stat-label">Competitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="statLeads">0</div>
                            <div class="stat-label">Leads</div>
                        </div>
                    </div>
                    <h3>📁 Downloads</h3>
                    <div class="download-grid" id="downloadGrid"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentUser = null;
        
        async function login() {
            const response = await fetch('http://localhost:5000/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await response.json();
            if (data.success) {
                currentUser = data.user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
            } else {
                alert('Login failed');
            }
        }
        
        async function runIntelligence() {
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('runBtn').disabled = true;
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                if (progress <= 90) {
                    document.getElementById('progressFill').style.width = progress + '%';
                    document.getElementById('progressText').textContent = 'Processing...';
                }
            }, 5000);
            
            const response = await fetch('http://localhost:5000/api/run-intelligence', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-User-Email': currentUser.email},
                body: JSON.stringify({
                    query: document.getElementById('searchQuery').value,
                    max_results: parseInt(document.getElementById('maxResults').value)
                })
            });
            
            clearInterval(interval);
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('statCompetitors').textContent = data.results.stats.competitors_found || 0;
                document.getElementById('statLeads').textContent = data.results.stats.total_leads || 0;
                
                const grid = document.getElementById('downloadGrid');
                grid.innerHTML = '';
                if (data.results.files.excel) {
                    grid.innerHTML += `<a href="http://localhost:5000/api/download/${data.results.files.excel}" class="download-btn">📊 Download Excel</a>`;
                }
                if (data.results.files.leads) {
                    grid.innerHTML += `<a href="http://localhost:5000/api/download/${data.results.files.leads}" class="download-btn">🎯 Download Leads</a>`;
                }
                
                document.getElementById('progressContainer').style.display = 'none';
                document.getElementById('resultsContainer').style.display = 'block';
                document.getElementById('runBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
