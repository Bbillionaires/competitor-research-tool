<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitive Intelligence Platform</title>
    <style>
        /* Import futuristic fonts */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --primary: #00d9ff;
            --secondary: #ff006e;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff0055;
            --bg-space: #0a0e27;
            --bg-card: #141b3d;
            --text: #e0e6ff;
            --text-dim: #8891b8;
            --border: #1e2d5f;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-space);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Animated space background */
        .space-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }
        
        .stars {
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 200s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes twinkle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Floating planets */
        .planet {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(1px);
            z-index: 1;
        }
        
        .planet-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 30% 30%, var(--primary), transparent);
            top: -100px;
            right: -100px;
            animation: float 30s ease-in-out infinite;
        }
        
        .planet-2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 40% 40%, var(--secondary), transparent);
            bottom: -80px;
            left: -80px;
            animation: float 40s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }
        
        /* Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(0, 217, 255, 0.5);
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* Search Panel */
        .search-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 50px rgba(0, 217, 255, 0.1);
        }
        
        .search-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select {
            background: var(--bg-space);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        
        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        /* CI Score Panel */
        .ci-score-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            display: none;
        }
        
        .ci-score-panel.active {
            display: block;
            animation: slideDown 0.5s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .ci-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .ci-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .ci-main {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            margin-bottom: 30px;
        }
        
        .ci-score-circle {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }
        
        .score-ring {
            width: 100%;
            height: 100%;
        }
        
        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .score-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
        }
        
        .score-label {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 5px;
        }
        
        .ci-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .metric-card {
            background: var(--bg-space);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        
        .metric-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .metric-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .insights-section {
            margin-top: 30px;
        }
        
        .insights-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary);
        }
        
        .insight-item {
            background: var(--bg-space);
            border-left: 3px solid var(--primary);
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        
        /* Competitors Table */
        .competitors-section {
            display: none;
        }
        
        .competitors-section.active {
            display: block;
            animation: slideDown 0.5s ease-out;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .export-btn {
            background: var(--success);
            color: #000;
        }
        
        .competitors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .competitor-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .competitor-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 30px rgba(0, 217, 255, 0.2);
            transform: translateY(-5px);
        }
        
        .competitor-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .competitor-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 5px;
        }
        
        .competitor-domain {
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        
        .score-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .competitor-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 3px;
        }
        
        .social-icons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .social-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            background: var(--bg-space);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        
        .social-icon:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .search-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .ci-main {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .search-grid {
                grid-template-columns: 1fr;
            }
            
            .competitors-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="space-bg"></div>
    <div class="stars"></div>
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    
    <div class="container">
        <header>
            <h1>COMPETITIVE INTELLIGENCE</h1>
            <p class="subtitle">Market Analysis Platform</p>
        </header>
        
        <!-- Search Panel -->
        <div class="search-panel">
            <div class="search-grid">
                <div class="input-group">
                    <label for="industry">Industry / Niche</label>
                    <input type="text" id="industry" placeholder="e.g., real estate investors, dental clinics, law firms">
                </div>
                
                <div class="input-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="e.g., Jacksonville, FL">
                </div>
                
                <div class="input-group">
                    <label for="max-results">Max Results</label>
                    <select id="max-results">
                        <option value="10">10 Competitors</option>
                        <option value="20" selected>20 Competitors</option>
                        <option value="30">30 Competitors</option>
                        <option value="50">50 Competitors</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label style="opacity: 0;">Search</label>
                    <button id="search-btn" onclick="runAnalysis()">🚀 Analyze</button>
                </div>
            </div>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing competitive landscape...</p>
        </div>
        
        <!-- CI Score Panel -->
        <div class="ci-score-panel" id="ci-panel">
            <div class="ci-header">
                <h2 class="ci-title">Competitive Intelligence Score</h2>
                <button class="export-btn" onclick="exportData('pdf')">📄 Export Report</button>
            </div>
            
            <div class="ci-main">
                <div class="ci-score-circle">
                    <svg class="score-ring" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#1e2d5f" stroke-width="8"/>
                        <circle id="score-progress" cx="50" cy="50" r="45" fill="none" stroke="url(#gradient)" stroke-width="8" 
                                stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round"
                                transform="rotate(-90 50 50)"/>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00d9ff"/>
                                <stop offset="100%" style="stop-color:#ff006e"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="score-value">
                        <div class="score-number" id="ci-score">0</div>
                        <div class="score-label">/ 100</div>
                        <div class="score-label" id="difficulty-rating" style="margin-top: 10px; font-size: 1rem; font-weight: 700;">-</div>
                    </div>
                </div>
                
                <div class="ci-metrics">
                    <div class="metric-card">
                        <div class="metric-label">Market Saturation</div>
                        <div class="metric-value" id="saturation">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total Competitors</div>
                        <div class="metric-value" id="total-competitors">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Content Size</div>
                        <div class="metric-value" id="avg-content">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Sites With Ads</div>
                        <div class="metric-value" id="sites-ads">0%</div>
                    </div>
                </div>
            </div>
            
            <div class="insights-section">
                <h3 class="insights-title">💡 Market Insights</h3>
                <div id="insights-container"></div>
            </div>
        </div>
        
        <!-- Competitors Section -->
        <div class="competitors-section" id="competitors-section">
            <div class="section-header">
                <h2 class="section-title">Competitor Analysis</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="export-btn" onclick="exportData('csv')">📊 Export CSV</button>
                    <button class="export-btn" onclick="exportData('json')">📋 Export JSON</button>
                </div>
            </div>
            
            <div class="competitors-grid" id="competitors-grid"></div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        
        function runAnalysis() {
            const industry = document.getElementById('industry').value;
            const location = document.getElementById('location').value;
            const maxResults = document.getElementById('max-results').value;
            
            if (!industry || !location) {
                alert('Please enter both industry and location');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('ci-panel').classList.remove('active');
            document.getElementById('competitors-section').classList.remove('active');
            
            // In production, this would call your Python backend
            // For now, simulate with stored data
            setTimeout(() => {
                loadData();
            }, 2000);
        }
        
        async function loadData() {
            try {
                // Try to load from competitive_intelligence.json
                const response = await fetch('competitive_intelligence.json');
                const data = await response.json();
                currentData = data;
                displayResults(data);
            } catch (error) {
                // Fallback to demo data
                console.log('Using demo data');
                displayDemoData();
            }
        }
        
        function displayResults(data) {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('ci-panel').classList.add('active');
            document.getElementById('competitors-section').classList.add('active');
            
            const ci = data.intelligence;
            
            // Update CI Score
            animateScore(ci.competitiveness_score);
            document.getElementById('difficulty-rating').textContent = ci.difficulty_rating;
            document.getElementById('difficulty-rating').style.color = ci.difficulty_color;
            
            // Update metrics
            document.getElementById('saturation').textContent = ci.market_saturation;
            document.getElementById('total-competitors').textContent = ci.metrics.total_competitors;
            document.getElementById('avg-content').textContent = ci.metrics.avg_word_count.toLocaleString() + ' words';
            document.getElementById('sites-ads').textContent = ci.metrics.sites_with_ads_pct + '%';
            
            // Display insights
            const insightsContainer = document.getElementById('insights-container');
            insightsContainer.innerHTML = '';
            ci.insights.forEach(insight => {
                const div = document.createElement('div');
                div.className = 'insight-item';
                div.textContent = insight;
                insightsContainer.appendChild(div);
            });
            
            // Display competitors
            displayCompetitors(data.competitors);
        }
        
        function animateScore(targetScore) {
            const scoreEl = document.getElementById('ci-score');
            const progressEl = document.getElementById('score-progress');
            const circumference = 283;
            const offset = circumference - (targetScore / 100) * circumference;
            
            let current = 0;
            const duration = 2000;
            const increment = targetScore / (duration / 16);
            
            const timer = setInterval(() => {
                current += increment;
                if (current >= targetScore) {
                    current = targetScore;
                    clearInterval(timer);
                }
                scoreEl.textContent = Math.round(current);
                progressEl.style.strokeDashoffset = circumference - (current / 100) * circumference;
            }, 16);
        }
        
        function displayCompetitors(competitors) {
            const grid = document.getElementById('competitors-grid');
            grid.innerHTML = '';
            
            competitors.forEach(comp => {
                const card = document.createElement('div');
                card.className = 'competitor-card';
                
                const socialIcons = [];
                if (comp.social_facebook) socialIcons.push('<div class="social-icon">📘</div>');
                if (comp.social_linkedin) socialIcons.push('<div class="social-icon">💼</div>');
                if (comp.social_instagram) socialIcons.push('<div class="social-icon">📷</div>');
                if (comp.social_twitter) socialIcons.push('<div class="social-icon">🐦</div>');
                
                card.innerHTML = `
                    <div class="competitor-header">
                        <div>
                            <div class="competitor-name">${comp.name || comp.domain}</div>
                            <div class="competitor-domain">${comp.domain}</div>
                        </div>
                        <div class="score-badge">${comp.competitor_score || 0}</div>
                    </div>
                    
                    <div class="competitor-stats">
                        <div class="stat">
                            <div class="stat-value">${formatNumber(comp.traffic_estimate || 0)}</div>
                            <div class="stat-label">Traffic/mo</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${comp.word_count || 0}</div>
                            <div class="stat-label">Words</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${comp.social_platform_count || 0}</div>
                            <div class="stat-label">Social</div>
                        </div>
                    </div>
                    
                    <div class="social-icons">
                        ${socialIcons.join('')}
                    </div>
                `;
                
                card.onclick = () => window.open(comp.url, '_blank');
                grid.appendChild(card);
            });
        }
        
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }
        
        function exportData(format) {
            if (!currentData) {
                alert('No data to export');
                return;
            }
            
            if (format === 'csv') {
                exportCSV(currentData.competitors);
            } else if (format === 'json') {
                exportJSON(currentData);
            } else if (format === 'pdf') {
                alert('PDF export will be implemented with backend integration');
            }
        }
        
        function exportCSV(competitors) {
            const headers = ['name', 'domain', 'address', 'competitor_score', 'traffic_estimate', 'word_count', 'social_platform_count'];
            const csv = [
                headers.join(','),
                ...competitors.map(c => headers.map(h => `"${c[h] || ''}"`).join(','))
            ].join('\n');
            
            downloadFile(csv, 'competitors.csv', 'text/csv');
        }
        
        function exportJSON(data) {
            const json = JSON.stringify(data, null, 2);
            downloadFile(json, 'competitive_intelligence.json', 'application/json');
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function displayDemoData() {
            // Demo data for testing
            const demoData = {
                query: "real estate investors jacksonville fl",
                date: "2026-02-08",
                intelligence: {
                    competitiveness_score: 72,
                    difficulty_rating: "Very Difficult",
                    difficulty_color: "#F59E0B",
                    market_saturation: "Saturated",
                    metrics: {
                        total_competitors: 20,
                        avg_word_count: 1450,
                        sites_with_ads_pct: 65,
                        avg_social_platforms: 2.8
                    },
                    insights: [
                        "Competitors invest heavily in content marketing",
