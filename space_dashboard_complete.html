<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitive Intelligence - Space Command</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d1b4e 100%);
            color: #e0e7ff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated starfield background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 60px 70px, #fff, transparent),
                radial-gradient(1px 1px at 50px 50px, #ddd, transparent),
                radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 90px 10px, #fff, transparent);
            background-size: 200px 200px;
            animation: stars 50s linear infinite;
            opacity: 0.5;
            z-index: 0;
        }
        
        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }
        
        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }
        
        .subtitle {
            text-align: center;
            font-size: 18px;
            color: #94a3b8;
            letter-spacing: 2px;
        }
        
        /* Search Controls */
        .search-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .search-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 20px;
            align-items: end;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: #60a5fa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 12px 20px;
            color: #e0e7ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }
        
        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
        }
        
        /* Competitive Score Panel */
        .score-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .score-display {
            font-family: 'Orbitron', monospace;
            font-size: 96px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }
        
        .score-label {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .difficulty-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 20px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #60a5fa;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
        }
        
        .stat-title {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: 700;
            color: #e0e7ff;
            margin-bottom: 5px;
        }
        
        .stat-subtitle {
            font-size: 14px;
            color: #94a3b8;
        }
        
        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 15px;
            padding: 25px;
        }
        
        .chart-title {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* Table */
        .table-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: rgba(99, 102, 241, 0.2);
            padding: 15px;
            text-align: left;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(99, 102, 241, 0.3);
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            color: #e0e7ff;
        }
        
        tr:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 100px;
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>⚡ SPACE COMMAND ⚡</h1>
            <div class="subtitle">Competitive Intelligence Platform</div>
        </div>
        
        <!-- Search Panel -->
        <div class="search-panel">
            <div class="search-grid">
                <div class="input-group">
                    <label>🎯 Industry</label>
                    <input type="text" id="industry" placeholder="e.g., law firms, dentists, real estate" value="law firms">
                </div>
                <div class="input-group">
                    <label>📍 Location</label>
                    <input type="text" id="location" placeholder="e.g., Jacksonville FL" value="jacksonville fl">
                </div>
                <div class="input-group">
                    <label>📊 Max Results</label>
                    <select id="maxResults">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <button class="btn" onclick="runAnalysis()">🚀 ANALYZE</button>
            </div>
        </div>
        
        <!-- Competitive Score -->
        <div id="scorePanel" class="score-panel hidden">
            <div class="score-label">Competitive Intelligence Score</div>
            <div class="score-display" id="scoreValue">0</div>
            <div class="difficulty-badge" id="difficultyBadge">Unknown</div>
            <div class="stat-subtitle" id="saturation">Market Saturation: Unknown</div>
        </div>
        
        <!-- Stats Grid -->
        <div id="statsGrid" class="stats-grid hidden"></div>
        
        <!-- Charts -->
        <div id="chartsGrid" class="charts-grid hidden"></div>
        
        <!-- Data Table -->
        <div id="tableContainer" class="table-container hidden">
            <h2 class="chart-title">📊 Competitor Analysis Data</h2>
            <table id="dataTable"></table>
        </div>
        
        <!-- Loading -->
        <div id="loading" class="loading hidden">
            ⚡ SCANNING COMPETITIVE LANDSCAPE ⚡<br>
            <small>This may take a few minutes...</small>
        </div>
    </div>
    
    <script>
        let competitorData = null;
        
        async function runAnalysis() {
            const industry = document.getElementById('industry').value;
            const location = document.getElementById('location').value;
            const maxResults = document.getElementById('maxResults').value;
            
            if (!industry || !location) {
                alert('Please enter both industry and location');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('scorePanel').classList.add('hidden');
            document.getElementById('statsGrid').classList.add('hidden');
            document.getElementById('chartsGrid').classList.add('hidden');
            document.getElementById('tableContainer').classList.add('hidden');
            
            // For demo - load sample data
            // In production, this would call your backend
            setTimeout(() => {
                loadSampleData();
            }, 2000);
        }
        
        function loadSampleData() {
            // Simulate loaded data
            fetch('competitive_intelligence.json')
                .then(response => response.json())
                .then(data => {
                    competitorData = data;
                    displayResults(data);
                })
                .catch(() => {
                    // If file doesn't exist, use sample data
                    const sampleData = generateSampleData();
                    displayResults(sampleData);
                });
        }
        
        function generateSampleData() {
            return {
                query: "law firms jacksonville fl",
                date: new Date().toISOString().split('T')[0],
                intelligence: {
                    competitiveness_score: 67,
                    difficulty_rating: "Very Difficult",
                    difficulty_color: "#F59E0B",
                    market_saturation: "Saturated",
                    insights: [
                        "Competitors invest heavily in content marketing",
                        "72% of competitors use paid advertising",
                        "Strong social media presence across industry",
                        "Growth-oriented market with active hiring"
                    ],
                    metrics: {
                        total_competitors: 15,
                        avg_word_count: 1850,
                        avg_social_platforms: 2.8,
                        sites_with_ads_pct: 72,
                        sites_hiring_pct: 25,
                        sites_with_schema_pct: 68,
                        avg_emails_per_site: 3.2
                    }
                },
                competitors: [] // Would be populated with actual data
            };
        }
        
        function displayResults(data) {
            document.getElementById('loading').classList.add('hidden');
            
            const intelligence = data.intelligence;
            
            // Display Score
            document.getElementById('scoreValue').textContent = intelligence.competitiveness_score;
            document.getElementById('difficultyBadge').textContent = intelligence.difficulty_rating;
            document.getElementById('difficultyBadge').style.background = intelligence.difficulty_color;
            document.getElementById('saturation').textContent = `Market Saturation: ${intelligence.market_saturation}`;
            document.getElementById('scorePanel').classList.remove('hidden');
            
            // Display Stats
            displayStats(intelligence.metrics);
            
            // Display Charts
            displayCharts(intelligence.metrics);
            
            // Display Table
            if (data.competitors && data.competitors.length > 0) {
                displayTable(data.competitors);
            }
        }
        
        function displayStats(metrics) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '';
            
            const stats = [
                { title: 'Total Competitors', value: metrics.total_competitors, subtitle: 'in market' },
                { title: 'Avg Content', value: metrics.avg_word_count.toLocaleString(), subtitle: 'words per site' },
                { title: 'Social Presence', value: metrics.avg_social_platforms.toFixed(1), subtitle: 'platforms average' },
                { title: 'Using Ads', value: metrics.sites_with_ads_pct + '%', subtitle: 'paid advertising' },
                { title: 'Hiring', value: metrics.sites_hiring_pct + '%', subtitle: 'actively growing' },
                { title: 'Advanced SEO', value: metrics.sites_with_schema_pct + '%', subtitle: 'with schema markup' }
            ];
            
            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-title">${stat.title}</div>
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-subtitle">${stat.subtitle}</div>
                `;
                statsGrid.appendChild(card);
            });
            
            statsGrid.classList.remove('hidden');
        }
        
        function displayCharts(metrics) {
            const chartsGrid = document.getElementById('chartsGrid');
            chartsGrid.innerHTML = `
                <div class="chart-card">
                    <div class="chart-title">Market Competition Analysis</div>
                    <canvas id="competitionChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Marketing Sophistication</div>
                    <canvas id="marketingChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Technical SEO Adoption</div>
                    <canvas id="seoChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Content & Social Presence</div>
                    <canvas id="contentChart"></canvas>
                </div>
            `;
            
            // Competition Chart
            new Chart(document.getElementById('competitionChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Using Ads', 'No Ads'],
                    datasets: [{
                        data: [metrics.sites_with_ads_pct, 100 - metrics.sites_with_ads_pct],
                        backgroundColor: ['#6366f1', '#1e293b']
                    }]
                },
                options: chartOptions
            });
            
            // Marketing Chart
            new Chart(document.getElementById('marketingChart'), {
                type: 'bar',
                data: {
                    labels: ['Paid Ads', 'Hiring', 'Schema SEO'],
                    datasets: [{
                        label: 'Adoption Rate (%)',
                        data: [metrics.sites_with_ads_pct, metrics.sites_hiring_pct, metrics.sites_with_schema_pct],
                        backgroundColor: ['#6366f1', '#8b5cf6', '#c084fc']
                    }]
                },
                options: chartOptions
            });
            
            // SEO Chart
            new Chart(document.getElementById('seoChart'), {
                type: 'pie',
                data: {
                    labels: ['With Schema', 'Without Schema'],
                    datasets: [{
                        data: [metrics.sites_with_schema_pct, 100 - metrics.sites_with_schema_pct],
                        backgroundColor: ['#8b5cf6', '#1e293b']
                    }]
                },
                options: chartOptions
            });
            
            // Content Chart
            new Chart(document.getElementById('contentChart'), {
                type: 'radar',
                data: {
                    labels: ['Content Size', 'Social Platforms', 'Email Access', 'Ad Spend', 'Growth'],
                    datasets: [{
                        label: 'Industry Average',
                        data: [
                            (metrics.avg_word_count / 30), // Normalize to ~0-100
                            (metrics.avg_social_platforms / 4 * 100),
                            (metrics.avg_emails_per_site / 5 * 100),
                            metrics.sites_with_ads_pct,
                            metrics.sites_hiring_pct
                        ],
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderColor: '#6366f1',
                        borderWidth: 2
                    }]
                },
                options: chartOptions
            });
            
            chartsGrid.classList.remove('hidden');
        }
        
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    labels: {
                        color: '#e0e7ff',
                        font: {
                            family: 'Rajdhani',
                            size: 14
                        }
                    }
                }
            },
            scales: {
                r: {
                    ticks: { color: '#e0e7ff', backdropColor: 'transparent' },
                    grid: { color: 'rgba(99, 102, 241, 0.2)' }
                },
                x: {
                    ticks: { color: '#e0e7ff' },
                    grid: { color: 'rgba(99, 102, 241, 0.2)' }
                },
                y: {
                    ticks: { color: '#e0e7ff' },
                    grid: { color: 'rgba(99, 102, 241, 0.2)' }
                }
            }
        };
        
        function displayTable(competitors) {
            const table = document.getElementById('dataTable');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Domain</th>
                        <th>Traffic</th>
                        <th>Score</th>
                        <th>Social</th>
                        <th>Ads</th>
                    </tr>
                </thead>
                <tbody>
                    ${competitors.slice(0, 10).map(c => `
                        <tr>
                            <td>${c.name || 'N/A'}</td>
                            <td>${c.domain || 'N/A'}</td>
                            <td>${(c.traffic_estimate || 0).toLocaleString()}</td>
                            <td>${c.competitor_score || 'N/A'}</td>
                            <td>${c.social_platform_count || 0}</td>
                            <td>${c.ads_signal ? '✓' : '✗'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            document.getElementById('tableContainer').classList.remove('hidden');
        }
        
        // Load data on page load if JSON exists
        window.onload = () => {
            fetch('competitive_intelligence.json')
                .then(response => response.json())
                .then(data => displayResults(data))
                .catch(() => console.log('No saved data found'));
        };
    </script>
</body>
</html>
