<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitor Intelligence Dashboard - Space Theme</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite;
        }
        
        body {
            background: #000;
            overflow-x: hidden;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.3);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.5);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.8);
        }
    </style>
</head>
<body class="min-h-screen text-white">
    <!-- File Input (Hidden) -->
    <input type="file" id="csvFileInput" accept=".csv" class="hidden">
    
    <!-- Main Container -->
    <div id="app"></div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        let competitorsData = [];
        let selectedCompetitor = null;

        // Load CSV file
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        competitorsData = results.data;
                        if (competitorsData.length > 0) {
                            selectedCompetitor = competitorsData[0];
                        }
                        renderDashboard();
                    }
                });
            }
        });

        function renderDashboard() {
            const app = document.getElementById('app');
            
            if (competitorsData.length === 0) {
                app.innerHTML = renderFileUpload();
                return;
            }
            
            app.innerHTML = `
                <!-- Stars Background -->
                <div class="fixed inset-0 z-0">
                    <div class="absolute inset-0 bg-gradient-to-b from-black via-gray-900 to-black"></div>
                    ${generateStars()}
                    
                    <!-- Planets -->
                    <div class="absolute top-20 right-20 w-32 h-32 rounded-full bg-gradient-to-br from-purple-500/30 to-blue-500/30 blur-2xl animate-pulse"></div>
                    <div class="absolute bottom-40 left-10 w-48 h-48 rounded-full bg-gradient-to-br from-blue-500/20 to-cyan-500/20 blur-3xl"></div>
                </div>

                <!-- Content -->
                <div class="relative z-10 p-8">
                    ${renderHeader()}
                    ${renderStats()}
                    ${renderCompetitorGrid()}
                </div>
            `;
            
            // Reinitialize icons after render
            lucide.createIcons();
            attachEventListeners();
        }

        function renderFileUpload() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-black">
                    <div class="text-center max-w-md">
                        <i data-lucide="rocket" class="text-purple-500 mx-auto mb-6" style="width: 64px; height: 64px;"></i>
                        <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent mb-4">
                            Competitor Intelligence
                        </h1>
                        <p class="text-gray-400 mb-8">Upload your competitor CSV to begin deep space analysis</p>
                        
                        <button onclick="document.getElementById('csvFileInput').click()" 
                                class="bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-4 px-8 rounded-lg transition-all shadow-lg">
                            <i data-lucide="upload" class="inline mr-2" style="width: 20px; height: 20px;"></i>
                            Upload CSV File
                        </button>
                        
                        <p class="text-gray-500 text-sm mt-4">File: competitors_final_profile.csv</p>
                    </div>
                </div>
            `;
        }

        function generateStars() {
            let stars = '';
            for (let i = 0; i < 50; i++) {
                const size = Math.random() * 3;
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const duration = Math.random() * 5 + 3;
                const opacity = Math.random() * 0.7 + 0.3;
                
                stars += `<div class="star" style="width: ${size}px; height: ${size}px; top: ${top}%; left: ${left}%; --duration: ${duration}s; opacity: ${opacity};"></div>`;
            }
            return stars;
        }

        function renderHeader() {
            return `
                <div class="mb-12">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="relative">
                            <i data-lucide="rocket" class="text-purple-500" style="width: 48px; height: 48px;"></i>
                            <div class="absolute -top-1 -right-1">
                                <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
                                <div class="w-3 h-3 bg-green-500 rounded-full absolute top-0"></div>
                            </div>
                        </div>
                        <div>
                            <h1 class="text-5xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 bg-clip-text text-transparent">
                                Competitor Intelligence
                            </h1>
                            <p class="text-gray-400 text-lg mt-1">Deep Space Market Analysis</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4 text-sm">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span class="text-gray-400">System Online</span>
                        </div>
                        <div class="text-gray-600">|</div>
                        <div class="text-gray-400">${competitorsData.length} Competitors Detected</div>
                        <div class="text-gray-600">|</div>
                        <button onclick="document.getElementById('csvFileInput').click()" 
                                class="text-purple-400 hover:text-purple-300">
                            Upload New File
                        </button>
                    </div>
                </div>
            `;
        }

        function renderStats() {
            const avgDA = Math.round(competitorsData.reduce((acc, c) => acc + (parseInt(c.domain_authority) || 0), 0) / competitorsData.length);
            const avgTraffic = Math.round(competitorsData.reduce((acc, c) => acc + (parseInt(c.traffic_estimate) || 0), 0) / competitorsData.length);
            
            return `
                <div class="grid grid-cols-4 gap-6 mb-8">
                    ${renderStatCard('globe', 'Total Competitors', competitorsData.length, 'text-blue-400', '+12%')}
                    ${renderStatCard('target', 'Avg Domain Authority', avgDA, 'text-purple-400', '+8%')}
                    ${renderStatCard('activity', 'Avg Traffic Est.', avgTraffic.toLocaleString(), 'text-cyan-400', '+24%')}
                    ${renderStatCard('star', 'Top Score', competitorsData[0]?.competitor_score || 0, 'text-yellow-400')}
                </div>
            `;
        }

        function renderStatCard(icon, label, value, color, trend = '') {
            return `
                <div class="relative group">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-600/20 to-blue-600/20 rounded-lg blur group-hover:blur-xl transition-all"></div>
                    <div class="relative bg-gray-900/80 backdrop-blur-sm border border-gray-700/50 rounded-lg p-6 hover:border-purple-500/50 transition-all">
                        <div class="flex items-center justify-between mb-4">
                            <i data-lucide="${icon}" class="${color}" style="width: 24px; height: 24px;"></i>
                            ${trend ? `<span class="text-green-400 text-sm flex items-center gap-1">
                                <i data-lucide="trending-up" style="width: 14px; height: 14px;"></i>
                                ${trend}
                            </span>` : ''}
                        </div>
                        <div class="text-gray-400 text-sm mb-1">${label}</div>
                        <div class="text-white text-2xl font-bold">${value}</div>
                    </div>
                </div>
            `;
        }

        function renderCompetitorGrid() {
            return `
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <div class="flex items-center gap-3 mb-4">
                            <i data-lucide="zap" class="text-purple-400" style="width: 20px; height: 20px;"></i>
                            <h2 class="text-2xl font-bold">Target Acquisition</h2>
                        </div>
                        
                        <div class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                            ${competitorsData.slice(0, 10).map((comp, idx) => renderCompetitorCard(comp, idx)).join('')}
                        </div>
                    </div>
                    
                    <div id="detailPanel">
                        ${renderDetailPanel()}
                    </div>
                </div>
            `;
        }

        function renderCompetitorCard(comp, idx) {
            const isSelected = selectedCompetitor?.domain === comp.domain;
            return `
                <div onclick="selectCompetitor(${idx})" 
                     class="relative group cursor-pointer ${isSelected ? 'ring-2 ring-purple-500' : ''}">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-600/10 to-blue-600/10 rounded-lg blur group-hover:blur-lg transition-all"></div>
                    <div class="relative bg-gray-900/60 backdrop-blur-sm border border-gray-700/30 rounded-lg p-4 hover:border-purple-500/50 transition-all">
                        <div class="flex items-start justify-between mb-2">
                            <div class="flex-1">
                                <div class="font-bold text-white mb-1">${comp.name || comp.domain}</div>
                                <div class="text-xs text-gray-500">${comp.domain}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                                    ${comp.competitor_score}
                                </div>
                                <div class="text-xs text-gray-500">Score</div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-3 mt-3 pt-3 border-t border-gray-700/50">
                            <div>
                                <div class="text-xs text-gray-500">DA</div>
                                <div class="text-sm font-semibold text-blue-400">${comp.domain_authority || 0}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Traffic</div>
                                <div class="text-sm font-semibold text-cyan-400">
                                    ${parseInt(comp.traffic_estimate || 0).toLocaleString()}
                                </div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Rating</div>
                                <div class="text-sm font-semibold text-yellow-400">
                                    ${comp.g_rating || 'N/A'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDetailPanel() {
            if (!selectedCompetitor) return '';
            
            return `
                <div class="flex items-center gap-3 mb-4">
                    <i data-lucide="target" class="text-cyan-400" style="width: 20px; height: 20px;"></i>
                    <h2 class="text-2xl font-bold">Deep Scan Results</h2>
                </div>
                
                <div class="relative">
                    <div class="absolute inset-0 bg-gradient-to-br from-purple-600/20 to-cyan-600/20 rounded-lg blur-xl"></div>
                    <div class="relative bg-gray-900/80 backdrop-blur-sm border border-gray-700/50 rounded-lg p-6 max-h-[600px] overflow-y-auto">
                        <h3 class="text-xl font-bold mb-6 bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">
                            ${selectedCompetitor.name || selectedCompetitor.domain}
                        </h3>
                        
                        <div class="space-y-6">
                            ${renderSection('SEO INTELLIGENCE', 'purple', [
                                ['Domain Authority', selectedCompetitor.domain_authority],
                                ['Backlinks', selectedCompetitor.backlink_signal],
                                ['Word Count', selectedCompetitor.word_count],
                                ['Internal Links', selectedCompetitor.internal_links]
                            ])}
                            
                            ${renderSection('SOCIAL PRESENCE', 'cyan', [
                                ['Platforms', selectedCompetitor.social_platform_count],
                                ['Social Score', (parseFloat(selectedCompetitor.social_metrics_signal || 0) * 100).toFixed(0) + '%']
                            ])}
                            
                            ${renderSection('PERFORMANCE METRICS', 'pink', [
                                ['Traffic Est.', parseInt(selectedCompetitor.traffic_estimate || 0).toLocaleString()],
                                ['Confidence', selectedCompetitor.confidence_score + '%']
                            ])}
                            
                            ${renderContactSection()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSection(title, color, items) {
            return `
                <div>
                    <div class="text-sm text-${color}-400 font-semibold mb-3 flex items-center gap-2">
                        <div class="w-1 h-4 bg-${color}-500 rounded"></div>
                        ${title}
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        ${items.map(([label, value]) => `
                            <div class="bg-gray-800/50 rounded p-2">
                                <div class="text-xs text-gray-500">${label}</div>
                                <div class="text-white font-semibold">${value || 'N/A'}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderContactSection() {
            const items = [];
            if (selectedCompetitor.phones) {
                items.push(`<div class="text-sm">
                    <span class="text-gray-500">Phone:</span>
                    <span class="text-white ml-2">${selectedCompetitor.phones.split('|')[0]}</span>
                </div>`);
            }
            if (selectedCompetitor.emails) {
                items.push(`<div class="text-sm">
                    <span class="text-gray-500">Email:</span>
                    <span class="text-white ml-2">${selectedCompetitor.emails.split('|')[0]}</span>
                </div>`);
            }
            if (selectedCompetitor.address) {
                items.push(`<div class="text-sm">
                    <span class="text-gray-500">Address:</span>
                    <span class="text-white ml-2">${selectedCompetitor.address}</span>
                </div>`);
            }
            
            if (items.length === 0) return '';
            
            return `
                <div>
                    <div class="text-sm text-yellow-400 font-semibold mb-3 flex items-center gap-2">
                        <div class="w-1 h-4 bg-yellow-500 rounded"></div>
                        CONTACT DATA
                    </div>
                    <div class="space-y-2">
                        ${items.join('')}
                    </div>
                </div>
            `;
        }

        function selectCompetitor(idx) {
            selectedCompetitor = competitorsData[idx];
            document.getElementById('detailPanel').innerHTML = renderDetailPanel();
            lucide.createIcons();
        }

        function attachEventListeners() {
            // Event listeners attached via onclick in HTML
        }

        // Initial render
        renderDashboard();
    </script>
</body>
</html>
