<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Intel - Competitive Intelligence Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: #050510;
            color: #e0e7ff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated cosmic background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 40, 200, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(40, 100, 200, 0.15) 0%, transparent 50%);
            animation: cosmic 20s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes cosmic {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }
        
        /* Starfield */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent);
            background-size: 200px 200px;
            animation: stars 60s linear infinite;
            opacity: 0.4;
            z-index: 0;
        }
        
        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }
        
        .container {
            max-width: 1900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background: rgba(5, 5, 16, 0.95);
        }
        
        .login-box {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.9) 0%, rgba(20, 15, 40, 0.9) 100%);
            border: 2px solid rgba(138, 92, 246, 0.4);
            border-radius: 25px;
            padding: 50px;
            width: 450px;
            box-shadow: 0 0 60px rgba(138, 92, 246, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .login-logo {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }
        
        .input-field {
            margin-bottom: 25px;
        }
        
        .input-field label {
            display: block;
            font-size: 13px;
            color: #8b5cf6;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .input-field input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 10, 30, 0.6);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 12px;
            color: #e0e7ff;
            font-size: 16px;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.3s;
        }
        
        .input-field input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(138, 92, 246, 0.4);
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(138, 92, 246, 0.4);
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(138, 92, 246, 0.6);
        }
        
        /* HEADER */
        .header {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 25px 40px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(138, 92, 246, 0.2);
        }
        
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        
        .user-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .user-name {
            font-weight: 600;
            color: #c4b5fd;
        }
        
        .user-tier {
            padding: 5px 15px;
            background: rgba(138, 92, 246, 0.2);
            border: 1px solid #8b5cf6;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .logout-btn {
            padding: 10px 25px;
            background: rgba(138, 92, 246, 0.2);
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            color: #8b5cf6;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: #8b5cf6;
            color: white;
        }
        
        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .tab {
            padding: 15px 35px;
            background: rgba(30, 20, 60, 0.6);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 12px;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 25px rgba(138, 92, 246, 0.5);
        }
        
        .tab:hover:not(.active) {
            border-color: #8b5cf6;
            color: #c4b5fd;
        }
        
        /* PANELS */
        .panel {
            display: none;
        }
        
        .panel.active {
            display: block;
        }
        
        /* SEARCH & FILTERS */
        .filters-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(15px);
        }
        
        .filters-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            font-size: 12px;
            color: #8b5cf6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .filter-group input,
        .filter-group select {
            padding: 12px 15px;
            background: rgba(15, 10, 30, 0.6);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 10px;
            color: #e0e7ff;
            font-size: 14px;
        }
        
        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        
        .filter-btn {
            padding: 12px 25px;
            background: rgba(138, 92, 246, 0.3);
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            color: #c4b5fd;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: #8b5cf6;
            color: white;
        }
        
        /* DATA TABLE */
        .table-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(138, 92, 246, 0.2);
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .table-title {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .table-actions {
            display: flex;
            gap: 15px;
        }
        
        .export-btn {
            padding: 12px 25px;
            background: rgba(138, 92, 246, 0.2);
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            color: #8b5cf6;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            background: #8b5cf6;
            color: white;
            box-shadow: 0 0 20px rgba(138, 92, 246, 0.5);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        .data-table th {
            background: rgba(138, 92, 246, 0.2);
            padding: 18px 15px;
            text-align: left;
            font-weight: 700;
            color: #c4b5fd;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
            border-bottom: 2px solid rgba(138, 92, 246, 0.3);
            cursor: pointer;
            position: relative;
        }
        
        .data-table th:hover {
            background: rgba(138, 92, 246, 0.3);
        }
        
        .data-table th.sortable::after {
            content: ' ⇅';
            opacity: 0.5;
        }
        
        .data-table th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        
        .data-table th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        
        .data-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(138, 92, 246, 0.1);
            color: #e0e7ff;
        }
        
        .data-table tr:hover {
            background: rgba(138, 92, 246, 0.1);
        }
        
        .data-table a {
            color: #8b5cf6;
            text-decoration: none;
        }
        
        .data-table a:hover {
            color: #ec4899;
            text-decoration: underline;
        }
        
        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }
        
        .pagination button {
            padding: 10px 20px;
            background: rgba(138, 92, 246, 0.2);
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            color: #8b5cf6;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #8b5cf6;
            color: white;
        }
        
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: #94a3b8;
            font-weight: 600;
        }
        
        /* CHARTS */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
        }
        
        .chart-title {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            text-align: center;
            color: #c4b5fd;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* STATS CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #8b5cf6;
            box-shadow: 0 0 30px rgba(138, 92, 246, 0.4);
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 100px;
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            color: #8b5cf6;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">⚡ SPACE INTEL</div>
            <div class="input-field">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" value="demo@customer.com">
            </div>
            <div class="input-field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" value="demo123">
            </div>
            <button class="login-btn" onclick="login()">ACCESS SYSTEM</button>
            <div style="margin-top: 20px; text-align: center; color: #64748b; font-size: 12px;">
                Demo: demo@customer.com / demo123<br>
                Admin: admin@spaceintel.com / admin123
            </div>
        </div>
    </div>
    
    <!-- MAIN APP -->
    <div id="mainApp" class="container hidden">
        <!-- Header -->
        <div class="header">
            <div class="logo">⚡ SPACE INTEL</div>
            <div class="user-info">
                <span class="user-tier" id="userTier">PRO</span>
                <span class="user-name" id="userName">User</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="showTab('dashboard')">📊 Dashboard</div>
            <div class="tab" onclick="showTab('data')">📁 Full Data</div>
            <div id="adminTab" class="tab hidden" onclick="showTab('admin')">⚙️ Admin</div>
        </div>
        
        <!-- DASHBOARD PANEL -->
        <div id="dashboardPanel" class="panel active">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="charts-grid" id="chartsGrid"></div>
        </div>
        
        <!-- DATA PANEL -->
        <div id="dataPanel" class="panel">
            <!-- Filters -->
            <div class="filters-card">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>🔍 Search</label>
                        <input type="text" id="searchInput" placeholder="Search name or domain...">
                    </div>
                    <div class="filter-group">
                        <label>🎯 Min Score</label>
                        <input type="number" id="minScore" placeholder="0">
                    </div>
                    <div class="filter-group">
                        <label>📈 Min Traffic</label>
                        <input type="number" id="minTraffic" placeholder="0">
                    </div>
                    <div class="filter-group">
                        <label>🏆 Tier</label>
                        <select id="tierFilter">
                            <option value="">All Tiers</option>
                            <option value="Tier 1">Tier 1</option>
                            <option value="Tier 2">Tier 2</option>
                            <option value="Tier 3">Tier 3</option>
                        </select>
                    </div>
                    <button class="filter-btn" onclick="applyFilters()">Apply</button>
                </div>
            </div>
            
            <!-- Data Table -->
            <div class="table-card">
                <div class="table-header">
                    <h2 class="table-title">Competitor Intelligence Data</h2>
                    <div class="table-actions">
                        <button class="export-btn" onclick="exportData('csv')">📄 CSV</button>
                        <button class="export-btn" onclick="exportData('excel')">📊 Excel</button>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="dataTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="pagination">
                    <button onclick="changePage(-1)" id="prevBtn">← Previous</button>
                    <span class="page-info">Page <strong id="currentPage">1</strong> of <strong id="totalPages">1</strong></span>
                    <button onclick="changePage(1)" id="nextBtn">Next →</button>
                    <select id="perPage" onchange="changePerPage()" style="margin-left: 20px; padding: 8px; border-radius: 8px; background: rgba(138, 92, 246, 0.2); border: 2px solid #8b5cf6; color: #e0e7ff;">
                        <option value="10">10 per page</option>
                        <option value="20" selected>20 per page</option>
                        <option value="50">50 per page</option>
                        <option value="100">100 per page</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- ADMIN PANEL -->
        <div id="adminPanel" class="panel">
            <div class="stats-grid" id="adminStats"></div>
            <div class="table-card">
                <h2 class="table-title">System Users</h2>
                <table class="data-table" id="usersTable"></table>
            </div>
        </div>
        
        <div id="loading" class="loading hidden">⚡ Loading Intelligence Data ⚡</div>
    </div>
    
    <script>
        let currentUser = null;
        let allCompetitors = [];
        let filteredCompetitors = [];
        let currentPage = 1;
        let perPage = 20;
        let sortColumn = null;
        let sortDirection = 'asc';
        
        // LOGIN
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({email, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('userName').textContent = data.user.company;
                    document.getElementById('userTier').textContent = data.user.tier.toUpperCase();
                    
                    if (data.user.role === 'admin') {
                        document.getElementById('adminTab').classList.remove('hidden');
                    }
                    
                    loadData();
                } else {
                    alert('Login failed: ' + data.error);
                }
            } catch (error) {
                alert('⚠️ Connection error! Make sure Flask backend is running:\n\npython flask_production_backend.py');
            }
        }
        
        // LOGOUT
        async function logout() {
            await fetch('http://localhost:5000/api/auth/logout', {
                method: 'POST',
                credentials: 'include'
            });
            location.reload();
        }
        
        // LOAD DATA
        async function loadData() {
            document.getElementById('loading').classList.remove('hidden');
            
            try {
                const response = await fetch('http://localhost:5000/api/competitors', {
                    credentials: 'include'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    allCompetitors = result.data.competitors || [];
                    filteredCompetitors = [...allCompetitors];
                    displayDashboard(result.data);
                    displayDataTable();
                }
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading data. Make sure you have run the profiler first!');
            }
            
            document.getElementById('loading').classList.add('hidden');
        }
        
        // DASHBOARD
        function displayDashboard(data) {
            const intelligence = data.intelligence || {};
            const competitors = data.competitors || [];
            
            // Stats Cards
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${intelligence.competitiveness_score || 0}</div>
                    <div class="stat-label">Competitive Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${competitors.length}</div>
                    <div class="stat-label">Total Competitors</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${intelligence.difficulty_rating || 'N/A'}</div>
                    <div class="stat-label">Market Difficulty</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${intelligence.market_saturation || 'N/A'}</div>
                    <div class="stat-label">Saturation Level</div>
                </div>
            `;
            
            // Charts
            createCharts(data);
        }
        
        function createCharts(data) {
            const competitors = data.competitors || [];
            const chartsGrid = document.getElementById('chartsGrid');
            
            chartsGrid.innerHTML = `
                <div class="chart-card">
                    <div class="chart-title">Traffic Distribution</div>
                    <canvas id="trafficChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Tier Distribution</div>
                    <canvas id="tierChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Social Presence</div>
                    <canvas id="socialChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Top 10 by Score</div>
                    <canvas id="topChart"></canvas>
                </div>
            `;
            
            // Traffic Chart
            const trafficData = competitors.map(c => parseInt(c.traffic_estimate) || 0).filter(t => t > 0);
            new Chart(document.getElementById('trafficChart'), {
                type: 'bar',
                data: {
                    labels: competitors.slice(0, 10).map(c => c.name || c.domain),
                    datasets: [{
                        label: 'Traffic',
                        data: competitors.slice(0, 10).map(c => parseInt(c.traffic_estimate) || 0),
                        backgroundColor: '#8b5cf6'
                    }]
                },
                options: getChartOptions()
            });
            
            // Tier Chart
            const tiers = {};
            competitors.forEach(c => {
                const tier = c.tier || 'Unknown';
                tiers[tier] = (tiers[tier] || 0) + 1;
            });
            
            new Chart(document.getElementById('tierChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(tiers),
                    datasets: [{
                        data: Object.values(tiers),
                        backgroundColor: ['#8b5cf6', '#ec4899', '#f59e0b', '#10b981']
                    }]
                },
                options: getChartOptions()
            });
            
            // Social Chart
            new Chart(document.getElementById('socialChart'), {
                type: 'pie',
                data: {
                    labels: ['Facebook', 'LinkedIn', 'Instagram', 'Twitter'],
                    datasets: [{
                        data: [
                            competitors.filter(c => c.social_facebook).length,
                            competitors.filter(c => c.social_linkedin).length,
                            competitors.filter(c => c.social_instagram).length,
                            competitors.filter(c => c.social_twitter).length
                        ],
                        backgroundColor: ['#3b82f6', '#0ea5e9', '#ec4899', '#8b5cf6']
                    }]
                },
                options: getChartOptions()
            });
            
            // Top 10 Chart
            const top10 = competitors
                .sort((a, b) => (parseInt(b.competitor_score) || 0) - (parseInt(a.competitor_score) || 0))
                .slice(0, 10);
            
            new Chart(document.getElementById('topChart'), {
                type: 'horizontalBar',
                data: {
                    labels: top10.map(c => c.name || c.domain),
                    datasets: [{
                        label: 'Score',
                        data: top10.map(c => parseInt(c.competitor_score) || 0),
                        backgroundColor: '#ec4899'
                    }]
                },
                options: getChartOptions()
            });
        }
        
        function getChartOptions() {
            return {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        labels: {
                            color: '#e0e7ff',
                            font: { family: 'Exo 2', size: 12 }
                        }
                    }
                },
                scales: {
                    x: { ticks: { color: '#e0e7ff' }, grid: { color: 'rgba(138, 92, 246, 0.1)' } },
                    y: { ticks: { color: '#e0e7ff' }, grid: { color: 'rgba(138, 92, 246, 0.1)' } }
                }
            };
        }
        
        // DATA TABLE
        function displayDataTable() {
            if (!filteredCompetitors || filteredCompetitors.length === 0) {
                document.getElementById('dataTable').innerHTML = '<p style="padding: 40px; text-align: center;">No data available</p>';
                return;
            }
            
            const columns = Object.keys(filteredCompetitors[0]);
            const priority = ['name', 'domain', 'address', 'phones', 'emails', 'traffic_estimate', 'competitor_score', 'tier'];
            const displayColumns = priority.filter(c => columns.includes(c))
                .concat(columns.filter(c => !priority.includes(c)).slice(0, 15));
            
            // Header
            const thead = document.getElementById('tableHead');
            thead.innerHTML = '<tr>' + displayColumns.map(col => 
                `<th class="sortable" onclick="sortTable('${col}')">${col.replace(/_/g, ' ').toUpperCase()}</th>`
            ).join('') + '</tr>';
            
            // Paginated Body
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageData = filteredCompetitors.slice(start, end);
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = pageData.map(comp => 
                '<tr>' + displayColumns.map(col => {
                    let value = comp[col] || '';
                    if (col === 'domain' && value) {
                        value = `<a href="http://${value}" target="_blank">${value}</a>`;
                    }
                    if (typeof value === 'string' && value.length > 100) {
                        value = value.substring(0, 100) + '...';
                    }
                    return `<td>${value}</td>`;
                }).join('') + '</tr>'
            ).join('');
            
            updatePagination();
        }
        
        // SORTING
        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            
            filteredCompetitors.sort((a, b) => {
                let aVal = a[column] || '';
                let bVal = b[column] || '';
                
                // Try to parse as numbers
                const aNum = parseFloat(aVal);
                const bNum = parseFloat(bVal);
                
                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return sortDirection === 'asc' ? aNum - bNum : bNum - aNum;
                }
                
                // String comparison
                aVal = String(aVal).toLowerCase();
                bVal = String(bVal).toLowerCase();
                
                if (sortDirection === 'asc') {
                    return aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
                } else {
                    return aVal > bVal ? -1 : aVal < bVal ? 1 : 0;
                }
            });
            
            currentPage = 1;
            displayDataTable();
        }
        
        // FILTERS
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const minScore = parseInt(document.getElementById('minScore').value) || 0;
            const minTraffic = parseInt(document.getElementById('minTraffic').value) || 0;
            const tier = document.getElementById('tierFilter').value;
            
            filteredCompetitors = allCompetitors.filter(c => {
                const matchSearch = !search || 
                    (c.name || '').toLowerCase().includes(search) ||
                    (c.domain || '').toLowerCase().includes(search);
                
                const matchScore = (parseInt(c.competitor_score) || 0) >= minScore;
                const matchTraffic = (parseInt(c.traffic_estimate) || 0) >= minTraffic;
                const matchTier = !tier || c.tier === tier;
                
                return matchSearch && matchScore && matchTraffic && matchTier;
            });
            
            currentPage = 1;
            displayDataTable();
        }
        
        // PAGINATION
        function updatePagination() {
            const totalPages = Math.ceil(filteredCompetitors.length / perPage);
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }
        
        function changePage(delta) {
            currentPage += delta;
            displayDataTable();
        }
        
        function changePerPage() {
            perPage = parseInt(document.getElementById('perPage').value);
            currentPage = 1;
            displayDataTable();
        }
        
        // EXPORT
        async function exportData(format) {
            window.open(`http://localhost:5000/api/export/${format}`, '_blank');
        }
        
        // TAB SWITCHING
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tabName + 'Panel').classList.add('active');
            
            if (tabName === 'admin' && currentUser.role === 'admin') {
                loadAdminData();
            }
        }
        
        // ADMIN
        async function loadAdminData() {
            const response = await fetch('http://localhost:5000/api/admin/stats', {
                credentials: 'include'
            });
            const result = await response.json();
            
            if (result.success) {
                const stats = result.stats;
                document.getElementById('adminStats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_users}</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_competitors}</div>
                        <div class="stat-label">Competitors Tracked</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.competitive_score}</div>
                        <div class="stat-label">Market Score</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.last_query || 'None'}</div>
                        <div class="stat-label">Last Query</div>
                    </div>
                `;
            }
        }
        
        // Check auth on load
        window.onload = async () => {
            const response = await fetch('http://localhost:5000/api/auth/check', {
                credentials: 'include'
            });
            const data = await response.json();
            
            if (data.authenticated) {
                currentUser = data.user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('userName').textContent = data.user.company;
                document.getElementById('userTier').textContent = data.user.tier.toUpperCase();
                
                if (data.user.role === 'admin') {
                    document.getElementById('adminTab').classList.remove('hidden');
                }
                
                loadData();
            }
        };
    </script>
</body>
</html>
