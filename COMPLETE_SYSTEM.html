<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Space Intel - Competitive Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: #050510;
            color: #e0e7ff;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 40, 200, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(40, 100, 200, 0.15) 0%, transparent 50%);
            animation: cosmic 20s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes cosmic {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: radial-gradient(2px 2px at 20% 30%, white, transparent),
                              radial-gradient(2px 2px at 60% 70%, white, transparent);
            background-size: 200px 200px;
            animation: stars 60s linear infinite;
            opacity: 0.4;
            z-index: 0;
        }
        
        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background: rgba(5, 5, 16, 0.95);
        }
        
        .login-box {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.9) 0%, rgba(20, 15, 40, 0.9) 100%);
            border: 2px solid rgba(138, 92, 246, 0.4);
            border-radius: 25px;
            padding: 50px;
            width: 450px;
            box-shadow: 0 0 60px rgba(138, 92, 246, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .login-logo {
            font-family: 'Orbitron', monospace;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }
        
        .input-field {
            margin-bottom: 25px;
        }
        
        .input-field label {
            display: block;
            font-size: 13px;
            color: #8b5cf6;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        .input-field input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 10, 30, 0.6);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 12px;
            color: #e0e7ff;
            font-size: 16px;
        }
        
        .input-field input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(138, 92, 246, 0.4);
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(138, 92, 246, 0.4);
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
        }
        
        .header {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 25px 40px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
        }
        
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logout-btn {
            padding: 10px 25px;
            background: rgba(138, 92, 246, 0.2);
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            color: #8b5cf6;
            cursor: pointer;
            font-weight: 600;
        }
        
        .logout-btn:hover {
            background: #8b5cf6;
            color: white;
        }
        
        .search-panel {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            backdrop-filter: blur(15px);
        }
        
        .search-title {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 20px;
            align-items: end;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            color: #8b5cf6;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 10, 30, 0.6);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 12px;
            color: #e0e7ff;
            font-size: 16px;
        }
        
        .search-btn {
            padding: 18px 40px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(138, 92, 246, 0.4);
        }
        
        .search-btn:hover:not(:disabled) {
            transform: translateY(-3px);
        }
        
        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(138, 92, 246, 0.2);
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            color: #8b5cf6;
            margin-top: 10px;
            font-family: 'Orbitron', monospace;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #8b5cf6;
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 10px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 30px;
        }
        
        .chart-title {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            text-align: center;
            color: #c4b5fd;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        
        .table-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8) 0%, rgba(20, 15, 40, 0.8) 100%);
            border: 2px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 30px;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        
        .table-title {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .export-btns {
            display: flex;
            gap: 15px;
        }
        
        .export-btn {
            padding: 10px 20px;
            background: rgba(138, 92, 246, 0.2);
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            color: #8b5cf6;
            cursor: pointer;
            font-weight: 600;
        }
        
        .export-btn:hover {
            background: #8b5cf6;
            color: white;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th {
            background: rgba(138, 92, 246, 0.2);
            padding: 15px 10px;
            text-align: left;
            color: #c4b5fd;
            text-transform: uppercase;
            font-size: 10px;
            white-space: nowrap;
        }
        
        .data-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(138, 92, 246, 0.1);
            color: #e0e7ff;
            font-size: 12px;
        }
        
        .data-table tr:hover {
            background: rgba(138, 92, 246, 0.1);
        }
        
        .prospect-high { color: #10b981; font-weight: 700; }
        .prospect-med { color: #f59e0b; font-weight: 600; }
        .prospect-low { color: #6b7280; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">⚡ SPACE INTEL</div>
            <div class="input-field">
                <label>Email</label>
                <input type="email" id="loginEmail" value="demo@customer.com">
            </div>
            <div class="input-field">
                <label>Password</label>
                <input type="password" id="loginPassword" value="demo123">
            </div>
            <button class="login-btn" onclick="login()">ACCESS SYSTEM</button>
            <div style="margin-top: 20px; text-align: center; color: #64748b; font-size: 12px;">
                Demo: demo@customer.com / demo123
            </div>
        </div>
    </div>
    
    <div id="mainApp" class="container hidden">
        <div class="header">
            <div class="logo">⚡ SPACE INTEL</div>
            <div>
                <span style="color: #c4b5fd; margin-right: 20px;" id="userName">User</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="search-panel">
            <div class="search-title">🎯 COMPETITIVE INTELLIGENCE SEARCH</div>
            <div class="search-grid">
                <div class="input-group">
                    <label>Industry</label>
                    <input type="text" id="industry" placeholder="e.g., law firms, dentists" value="law firms">
                </div>
                <div class="input-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="e.g., Jacksonville FL" value="jacksonville fl">
                </div>
                <div class="input-group">
                    <label>Max Results</label>
                    <select id="maxResults">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <button class="search-btn" id="searchBtn" onclick="runAnalysis()">🚀 ANALYZE</button>
            </div>
            
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>
        
        <div id="results" class="hidden">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="charts-grid" id="chartsGrid"></div>
            
            <div class="table-card">
                <div class="table-header">
                    <h2 class="table-title">💰 Prospect Intelligence</h2>
                    <div class="export-btns">
                        <button class="export-btn" onclick="exportData('csv')">📄 CSV</button>
                        <button class="export-btn" onclick="exportData('excel')">📊 Excel</button>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="dataTable"></table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentUser = null;
        let resultsData = null;
        
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch('https://competitor-research-tool.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({email, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.user;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('userName').textContent = data.user.company;
                } else {
                    alert('Login failed: ' + data.error);
                }
            } catch (error) {
                alert('⚠️ Connection error!');
            }
        }
        
        function logout() {
            fetch('https://competitor-research-tool.onrender.com/api/auth/logout', {
                method: 'POST',
                credentials: 'include'
            });
            location.reload();
        }
        
        async function runAnalysis() {
            const industry = document.getElementById('industry').value;
            const location = document.getElementById('location').value;
            const maxResults = document.getElementById('maxResults').value;
            
            if (!industry || !location) {
                alert('Please enter industry and location');
                return;
            }
            
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('searchBtn').textContent = '⚡ ANALYZING...';
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressText').textContent = 'Running AI prospect analysis...';
            document.getElementById('results').classList.add('hidden');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                if (progress <= 90) {
                    document.getElementById('progressFill').style.width = progress + '%';
                }
            }, 1000);
            
            try {
                const response = await fetch('https://competitor-research-tool.onrender.com/api/run-analysis', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({
                        industry,
                        location,
                        max_results: parseInt(maxResults)
                    })
                });
                
                clearInterval(interval);
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('progressFill').style.width = '100%';
                    document.getElementById('progressText').textContent = '✅ Analysis Complete!';
                    
                    setTimeout(() => {
                        resultsData = data;
                        displayResults(data);
                        document.getElementById('progressBar').style.display = 'none';
                    }, 1000);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                clearInterval(interval);
                alert('Error running analysis: ' + error.message);
            } finally {
                document.getElementById('searchBtn').disabled = false;
                document.getElementById('searchBtn').textContent = '🚀 ANALYZE';
            }
        }
        
        function displayResults(data) {
            const stats = data.stats;
            const competitors = data.competitors;
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.total}</div>
                    <div class="stat-label">Total Competitors</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.avg_score}</div>
                    <div class="stat-label">Avg Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.avg_traffic.toLocaleString()}</div>
                    <div class="stat-label">Avg Traffic</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.tier1_count}</div>
                    <div class="stat-label">Tier 1 Count</div>
                </div>
            `;
            
            createCharts(competitors);
            displayTable(competitors);
            
            document.getElementById('results').classList.remove('hidden');
        }
        
        function createCharts(competitors) {
            document.getElementById('chartsGrid').innerHTML = `
                <div class="chart-card"><div class="chart-title">Traffic Distribution</div><canvas id="chart1"></canvas></div>
                <div class="chart-card"><div class="chart-title">Tier Breakdown</div><canvas id="chart2"></canvas></div>
            `;
            
            const opts = {
                responsive: true,
                plugins: { legend: { labels: { color: '#e0e7ff' } } },
                scales: {
                    x: { ticks: { color: '#e0e7ff' }, grid: { color: 'rgba(138, 92, 246, 0.1)' } },
                    y: { ticks: { color: '#e0e7ff' }, grid: { color: 'rgba(138, 92, 246, 0.1)' } }
                }
            };
            
            new Chart(document.getElementById('chart1'), {
                type: 'bar',
                data: {
                    labels: competitors.slice(0, 10).map(c => c.name || c.domain),
                    datasets: [{
                        label: 'Traffic',
                        data: competitors.slice(0, 10).map(c => parseInt(c.traffic_estimate) || 0),
                        backgroundColor: '#8b5cf6'
                    }]
                },
                options: opts
            });
            
            const tiers = {};
            competitors.forEach(c => tiers[c.tier] = (tiers[c.tier] || 0) + 1);
            new Chart(document.getElementById('chart2'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(tiers),
                    datasets: [{ data: Object.values(tiers), backgroundColor: ['#8b5cf6', '#ec4899', '#f59e0b'] }]
                },
                options: { responsive: true, plugins: { legend: { labels: { color: '#e0e7ff' } } } }
            });
        }
        
        function displayTable(competitors) {
            const columns = [
                'name', 'domain', 'phones', 'emails',
                'prospect_likelihood_score',
                'trigger_summary',
                'score_momentum',
                'traffic_estimate',
                'competitor_score',
                'tier'
            ];
            
            let html = '<thead><tr>' + columns.map(c => `<th>${c.toUpperCase().replace(/_/g, ' ')}</th>`).join('') + '</tr></thead><tbody>';
            
            competitors.slice(0, 50).forEach(row => {
                html += '<tr>' + columns.map(col => {
                    let val = row[col] || '';
                    
                    // Format prospect score with color
                    if (col === 'prospect_likelihood_score') {
                        const score = parseFloat(val) || 0;
                        const cls = score >= 7 ? 'prospect-high' : score >= 5 ? 'prospect-med' : 'prospect-low';
                        return `<td><span class="${cls}">${score}/10</span></td>`;
                    }
                    
                    if (typeof val === 'string' && val.length > 60) {
                        val = val.substring(0, 60) + '...';
                    }
                    return `<td>${val}</td>`;
                }).join('') + '</tr>';
            });
            
            html += '</tbody>';
            document.getElementById('dataTable').innerHTML = html;
        }
        
        function exportData(format) {
            window.open(`https://competitor-research-tool.onrender.com/api/export/${format}`, '_blank');
        }
    </script>
</body>
</html>
